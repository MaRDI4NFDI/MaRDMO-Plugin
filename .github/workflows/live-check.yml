name: Live check

# Every night (and when started by hand): do the MaRDI Portal and Wikidata
# still answer MaRDMO's requests as recorded?  Read-only, one request per
# second (tests/live).  Not required for pull requests: a failure opens an
# issue "Live check failed", or comments on the open one.  Scheduled runs
# use the default branch.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: live-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  live:
    name: MaRDI Portal and Wikidata
    runs-on: ubuntu-latest
    steps:
      - name: Check out MaRDMO
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install RDMO and MaRDMO with the test tools
        run: |
          python -m pip install --upgrade pip
          pip install "rdmo==2.5.2"
          pip install -e ".[test]"

      - name: Live check
        env:
          LIVE: '1'
          LIVE_REPORT: live-report.md
        run: pytest tests/live --force-enable-socket

      - name: Summary
        if: always()
        run: |
          if [ -f live-report.md ]; then cat live-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Report the failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          { [ -f live-report.md ] && cat live-report.md || echo "The live check failed before its report: see the run."
            echo
            echo "Run: $RUN"
            echo
            echo "A change of the portal or Wikidata data: record again (RECORD=1, tests/recordings.py)."
            echo "A change of their API: adapt MaRDMO."
          } > issue.md
          issue=$(gh issue list --state open --search 'in:title "Live check failed"' --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file issue.md
          else
            gh issue create --title "Live check failed" --body-file issue.md
          fi
