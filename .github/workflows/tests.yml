name: Tests

# Every push: one quick combination.  Pull requests to main or the 0.8.0
# integration branch and releases (pypi-publish.yml calls this workflow):
# every supported combination.
on:
  push:
    branches-ignore: [gh-pages, dev-tests]
  pull_request:
    branches: [main, '0.8.0']
  workflow_call:
    inputs:
      # The release is started by a tag push; without this, it would get
      # the one combination of a push
      full_matrix:
        type: boolean
        default: false
      # A questionnaire tag (the release tests against its latest release);
      # empty: the branch with the same name as this branch, else main
      questionnaire_ref:
        type: string
        default: ''

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}, RDMO ${{ matrix.rdmo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'push' && !inputs.full_matrix && fromJSON('["3.14"]') || fromJSON('["3.10", "3.13", "3.14"]') }}
        rdmo: ${{ github.event_name == 'push' && !inputs.full_matrix && fromJSON('["2.5.2"]') || fromJSON('["2.5.1", "2.5.2"]') }}

    steps:
      - name: Check out MaRDMO
        uses: actions/checkout@v7

      # The given questionnaire tag (release), else the questionnaire branch
      # with the same name as this branch, else main
      - name: Find the questionnaire branch
        id: questionnaire
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if [ -n "${{ inputs.questionnaire_ref }}" ]; then
            echo "ref=${{ inputs.questionnaire_ref }}" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads https://github.com/MaRDI4NFDI/MaRDMO-Questionnaire "$branch" > /dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the questionnaire (${{ steps.questionnaire.outputs.ref }})
        uses: actions/checkout@v7
        with:
          repository: MaRDI4NFDI/MaRDMO-Questionnaire
          ref: ${{ steps.questionnaire.outputs.ref }}
          path: questionnaire

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install RDMO ${{ matrix.rdmo }} and MaRDMO with the test tools
        run: |
          python -m pip install --upgrade pip
          pip install "rdmo==${{ matrix.rdmo }}"
          pip install -e ".[test]"

      - name: Lint (ruff)
        run: ruff check MaRDMO tests

      - name: Tests
        env:
          QUESTIONNAIRE: questionnaire/catalog
        run: coverage run -m pytest

      - name: Coverage
        run: coverage report --skip-covered --sort=cover | tail -25

      - name: Build the package
        run: python -m build

  # The documentation builds without warnings (docs.yml publishes it from main);
  # it includes sections of the README, see mkdocs.yml
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out MaRDMO
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material "mkdocstrings[python]"

      - name: Build the documentation
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: mkdocs build --strict
