name: Tests

# Every push: one quick combination.  Pull requests to main or an
# integration branch (named by its version, e.g. 0.8.0) and releases
# (pypi-publish.yml calls this workflow): every supported combination.
on:
  push:
    branches-ignore: [gh-pages, dev-tests]
  pull_request:
    branches: [main, '[0-9]+.[0-9]+.[0-9]+']
  workflow_call:
    inputs:
      # The release is started by a tag push; without this, it would get
      # the one combination of a push
      full_matrix:
        type: boolean
        default: false
      # A questionnaire tag (the release tests against its latest release);
      # empty: see "Find the questionnaire branch"
      questionnaire_ref:
        type: string
        default: ''

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}, RDMO ${{ matrix.rdmo }}${{ matrix.db_label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'push' && !inputs.full_matrix && fromJSON('["3.14"]') || fromJSON('["3.10", "3.13", "3.14"]') }}
        rdmo: ${{ github.event_name == 'push' && !inputs.full_matrix && fromJSON('["2.5.2"]') || fromJSON('["2.5.1", "2.5.2"]') }}
        db: [sqlite]
        # Besides: one combination each on the databases of production
        # installations (RDMO's extras install their drivers)
        include: ${{ github.event_name == 'push' && !inputs.full_matrix && fromJSON('[]') || fromJSON('[{"python":"3.14","rdmo":"2.5.2","db":"postgresql","db_label":", PostgreSQL 16","image":"postgres:16","port":"5432","user":"postgres","extra":"postgres","health":"pg_isready"},{"python":"3.14","rdmo":"2.5.2","db":"mysql","db_label":", MariaDB 11","image":"mariadb:11","port":"3306","user":"root","extra":"mysql","health":"healthcheck.sh --connect --innodb_initialized"}]') }}

    # Not started for SQLite (empty image)
    services:
      database:
        image: ${{ matrix.image || '' }}
        env:
          POSTGRES_PASSWORD: mardmo
          MARIADB_ROOT_PASSWORD: mardmo
        ports:
          - ${{ matrix.port || '5432' }}:${{ matrix.port || '5432' }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      # The history, to find the integration branch this commit is based on
      - name: Check out MaRDMO
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The given questionnaire tag (release), else the questionnaire branch
      # with the same name as this branch, else the one of the integration
      # branch (e.g. 0.8.0) this branch shares commits with, else main.
      # Delete the integration branches in both repositories after their
      # release.
      - name: Find the questionnaire branch
        id: questionnaire
        run: |
          questionnaire=https://github.com/MaRDI4NFDI/MaRDMO-Questionnaire
          branch="${{ github.head_ref || github.ref_name }}"
          ref=main
          if [ -n "${{ inputs.questionnaire_ref }}" ]; then
            ref="${{ inputs.questionnaire_ref }}"
          elif git ls-remote --exit-code --heads "$questionnaire" "$branch" > /dev/null; then
            ref="$branch"
          else
            for integration in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin \
                                 | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'); do
              # Shares commits with it that main has not: also a branch
              # continued after its pull request was merged
              if [ "$(git rev-list --count "origin/main..$(git merge-base "origin/$integration" HEAD)")" -gt 0 ] \
                 && git ls-remote --exit-code --heads "$questionnaire" "$integration" > /dev/null; then
                ref="$integration"
              fi
            done
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the questionnaire (${{ steps.questionnaire.outputs.ref }})
        uses: actions/checkout@v7
        with:
          repository: MaRDI4NFDI/MaRDMO-Questionnaire
          ref: ${{ steps.questionnaire.outputs.ref }}
          path: questionnaire

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # mysqlclient is built from source
      - name: Install the MariaDB client library
        if: matrix.db == 'mysql'
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev pkg-config

      - name: Install RDMO ${{ matrix.rdmo }} and MaRDMO with the test tools
        run: |
          python -m pip install --upgrade pip
          pip install "rdmo${{ matrix.extra && format('[{0}]', matrix.extra) || '' }}==${{ matrix.rdmo }}"
          pip install -e ".[test]"

      - name: Lint (ruff)
        run: ruff check MaRDMO tests docs_hooks

      # The database container is the only host the tests may reach
      - name: Tests
        env:
          QUESTIONNAIRE: questionnaire/catalog
          TEST_DB: ${{ matrix.db }}
          TEST_DB_USER: ${{ matrix.user }}
          TEST_DB_PASSWORD: mardmo
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: ${{ matrix.port }}
        run: coverage run -m pytest ${{ matrix.image && '--allow-hosts=127.0.0.1' || '' }}

      - name: Coverage
        run: coverage report --skip-covered --sort=cover | tail -25

      - name: Build the package
        run: python -m build

  # The documentation builds without warnings (docs.yml publishes it from main);
  # it includes sections of the README, see mkdocs.yml
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out MaRDMO
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material "mkdocstrings[python]"

      - name: Build the documentation
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: mkdocs build --strict
