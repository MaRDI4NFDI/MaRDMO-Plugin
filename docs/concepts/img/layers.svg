<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">The layers of MaRDMO</title>
  <desc id="desc">Seven boxes from top to bottom: entry points, catalogs, export, components, project and sources side by side, core. Each layer uses only the layers below it; the one exception is the dashed arrow from sources to project.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="540" fill="#ffffff"/>

  <!-- Entry points -->
  <rect x="40" y="20" width="600" height="68" rx="8" fill="#eceff1" stroke="#90a4ae"/>
  <text x="56" y="42" font-size="14" font-weight="bold" fill="#263238">Entry points <tspan font-weight="normal" fill="#546e7a">— what Django and RDMO call</tspan></text>
  <text x="56" y="62" font-size="12" font-family="Menlo, Consolas, monospace" fill="#263238">apps · main · views · urls · router · builders</text>
  <text x="56" y="78" font-size="12" font-family="Menlo, Consolas, monospace" fill="#263238">providers · optionsets · templatetags</text>

  <!-- Catalogs -->
  <rect x="40" y="104" width="600" height="68" rx="8" fill="#e8eaf6" stroke="#7986cb"/>
  <text x="56" y="126" font-size="14" font-weight="bold" fill="#1a237e">Catalogs <tspan font-weight="normal" fill="#3949ab">— each declares itself in its catalog.py</tspan></text>
  <text x="56" y="146" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1a237e">model/ · algorithm/ · workflow/ · search/</text>
  <text x="56" y="162" font-size="12" fill="#3949ab">found through the registry in core/catalogs.py</text>

  <!-- export -->
  <rect x="40" y="188" width="600" height="68" rx="8" fill="#e0f2f1" stroke="#4db6ac"/>
  <text x="56" y="210" font-size="14" font-weight="bold" fill="#004d40">export/ <tspan font-weight="normal" fill="#00796b">— from the answers to the MaRDI Portal</tspan></text>
  <text x="56" y="230" font-size="12" font-family="Menlo, Consolas, monospace" fill="#004d40">pipeline · checks · problems · duplicates · worker · payload/</text>
  <text x="56" y="246" font-size="12" font-family="Menlo, Consolas, monospace" fill="#004d40">items · relations · ordering · upload · oauth2 · store · success</text>

  <!-- components -->
  <rect x="40" y="272" width="600" height="68" rx="8" fill="#fff8e1" stroke="#ffb74d"/>
  <text x="56" y="294" font-size="14" font-weight="bold" fill="#e65100">components/ <tspan font-weight="normal" fill="#ef6c00">— the parts of the interview</tspan></text>
  <text x="56" y="314" font-size="12" font-family="Menlo, Consolas, monospace" fill="#5d4037">dropdowns · fill/ · validators · tex_check · publication/</text>
  <text x="56" y="330" font-size="12" fill="#ef6c00">search the knowledge graph, fill in, validate, cite by DOI</text>

  <!-- project -->
  <rect x="40" y="356" width="270" height="68" rx="8" fill="#f3e5f5" stroke="#ba68c8"/>
  <text x="56" y="378" font-size="14" font-weight="bold" fill="#4a148c">project/ <tspan font-weight="normal" fill="#7b1fa2">— RDMO's database</tspan></text>
  <text x="56" y="398" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4a148c">answers · identity · pages</text>
  <text x="56" y="414" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4a148c">rules · writes</text>

  <!-- sources -->
  <rect x="370" y="356" width="270" height="68" rx="8" fill="#e3f2fd" stroke="#64b5f6"/>
  <text x="386" y="378" font-size="14" font-weight="bold" fill="#0d47a1">sources/ <tspan font-weight="normal" fill="#1565c0">— external services</tspan></text>
  <text x="386" y="398" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0d47a1">http · sparql · wikibase</text>
  <text x="386" y="414" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0d47a1">portal · wikidata · citations</text>

  <!-- the one exception -->
  <line x1="368" y1="404" x2="314" y2="404" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="340" y="394" font-size="10" text-anchor="middle" fill="#555">commit</text>

  <!-- core -->
  <rect x="40" y="440" width="600" height="68" rx="8" fill="#f1f8e9" stroke="#aed581"/>
  <text x="56" y="462" font-size="14" font-weight="bold" fill="#33691e">core/ <tspan font-weight="normal" fill="#558b2f">— no database, no requests</tspan></text>
  <text x="56" y="482" font-size="12" font-family="Menlo, Consolas, monospace" fill="#33691e">config · ids · models · properties · markers · searches</text>
  <text x="56" y="498" font-size="12" font-family="Menlo, Consolas, monospace" fill="#33691e">values · patterns · constants · catalogs</text>

  <!-- direction -->
  <line x1="700" y1="30" x2="700" y2="500" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="716" y="250" font-size="13" fill="#37474f">uses</text>
  <text x="716" y="268" font-size="11" fill="#607d8b">the layers</text>
  <text x="716" y="282" font-size="11" fill="#607d8b">below only</text>
  <text x="40" y="530" font-size="11" fill="#607d8b">Dashed: the one exception — sources/ commits MaRDMO's pending writes (project.writes) before a request.</text>
</svg>
