{% load i18n %}
<h3 id="transferability-to">{% translate "Transferability to..." %}</h3>
{% for statements in transferability %}
    {% for statement in statements.values %}
        {{ statement }} <br>
    {% endfor %}
    {% if not forloop.last %}<br>{% endif %}
{% empty %}
    <strong class="mardmo-empty">{% translate "NOT DOCUMENTED" %}</strong>
{% endfor %}
