{% load mardmo_tags %}
<h3 id="{{ anchor }}">Relations to {{ title }}</h3>
{% for relatant in relatants.values %}
    {{ relation }}: {% user_entity relatant.ID relatant.Name relatant.Description class %} <br>
{% empty %}
    {% if empty_msg == "True" %}
        <strong class="mardmo-error">MISSING {{ class }}</strong>
    {% else %}
        <strong class="mardmo-empty">NOT DOCUMENTED</strong>
    {% endif %}
{% endfor %}
