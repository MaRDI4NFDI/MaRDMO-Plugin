site_name: MaRDMO Documentation

# Builds the tables of docs/vocabulary.md from the data files
hooks:
  - docs_hooks/vocabulary.py

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_options:
              # MaRDMO's docstrings describe types in prose; most signatures have no annotations
              warn_missing_types: false

nav:
  - Home: index.md
  - Vocabulary: vocabulary.md
  - Using MaRDMO:
      - Documenting Items: usage/items.md
  - Concepts:
      - Dynamic Providers: concepts/providers.md
      - Handlers: concepts/handlers.md
      - Publications: concepts/publication.md
      - Item IDs: concepts/ids.md
      - Export Pipeline: concepts/export.md
      - Validation: concepts/validation.md
  - How to:
      - RDMO:
          - Create a New Attribute: how-to/rdmo/add-attribute.md
          - Create a New Catalog: how-to/rdmo/add-catalog.md
          - Create a New Condition: how-to/rdmo/add-condition.md
          - Create a New Option: how-to/rdmo/add-option.md
          - Create a New Optionset: how-to/rdmo/add-optionset.md
          - Create a New Page: how-to/rdmo/add-page.md
          - Create a New Question: how-to/rdmo/add-question.md
          - Create a New Question Set: how-to/rdmo/add-questionset.md
          - Create a New Section: how-to/rdmo/add-section.md
      - MaRDMO:
          - Add a Data Property: how-to/mardmo/data-property.md
          - Add a Question: how-to/mardmo/register-question.md
          - Extend the Export: how-to/mardmo/extend-export.md
          - Validate a New Field: how-to/mardmo/validate-field.md
          - Run and Update the Tests: how-to/mardmo/tests.md
          - Make a Release: how-to/mardmo/release.md
  - Reference:
      - Core:
          - Entry Points: reference/mardmo.md
          - Checks: reference/checks.md
          - Payload: reference/payload.md
          - Data Access: reference/data.md
          - Utilities: reference/helpers.md
          - Question Configuration: reference/questions.md
      - Submodules:
          - Model: reference/model.md
          - Algorithm: reference/algorithm.md
          - Workflow: reference/workflow.md
          - Publication: reference/publication.md
          - Search: reference/search.md

markdown_extensions:
  # docs/index.md includes the installation sections of the README
  - pymdownx.snippets:
      check_paths: true
