[build-system]
# SPDX license expression (project.license) needs setuptools 77
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MaRDMO"
# The version is set in MaRDMO/__init__.py only (see [tool.setuptools.dynamic])
dynamic = ["version"]
description = "RDMO Plugin to document and query mathematical research data using the MaRDI infrastructure."
readme = "README.md"
authors = [{name = "Marco Reidelbach", email = "reidelbach@zib.de"}]
maintainers = [{name = "Marco Reidelbach", email = "reidelbach@zib.de"}]
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"

dependencies = [
    "rdmo>=2.5.1"
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]


[project.urls]
homepage = "https://github.com/MaRDI4NFDI/MaRDMO-Plugin"

[tool.setuptools.dynamic]
version = {attr = "MaRDMO.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["MaRDMO*"]

[tool.setuptools.package-data]
"MaRDMO" = ["templates/MaRDMO/*.html", "templates/MaRDMO/partials/*.html", "data/*.json", "static/MaRDMO/css/*.css", "static/MaRDMO/images/*.png", "static/MaRDMO/js/**/*", "algorithm/data/*.json", "model/data/*.json", "publication/data/*.json", "search/data/*.json", "workflow/data/*.json", "model/queries/*.sparql", "model/queries/split/*.sparql", "algorithm/queries/*.sparql", "publication/queries/*.sparql", "workflow/queries/*.sparql", "queries/*.sparql"]

[project.optional-dependencies]
# pip install -e ".[test]"; the tests and CI use these
test = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-socket>=0.7",
    "rdflib>=7",
    "pyyaml>=6",
    "coverage[toml]>=7",
    "ruff>=0.6",
    "build>=1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
# No network in the tests: portal, Wikidata and citation services are
# replaced by recorded answers (pytest-socket fails every other request)
# Tests that need the database create its tables without RDMO's migrations (faster)
addopts = "--disable-socket --allow-unix-socket --no-migrations"
filterwarnings = [
    # RDMO's URL fields ahead of Django 6; not MaRDMO's to fix
    "ignore:The default scheme will be changed",
    # django-compressor, used by RDMO's templates
    "ignore:codecs.open\\(\\) is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["MaRDMO"]

[tool.ruff]
extend-exclude = ["dev-tests"]

[tool.ruff.lint]
# Errors only (pyflakes, syntax); style rules can be added later
select = ["F", "E9"]

