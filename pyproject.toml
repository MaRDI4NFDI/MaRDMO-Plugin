[build-system]
# SPDX license expression (project.license) needs setuptools 77
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MaRDMO"
# The version is set in MaRDMO/__init__.py only (see [tool.setuptools.dynamic])
dynamic = ["version"]
description = "RDMO Plugin to document and query mathematical research data using the MaRDI infrastructure."
readme = "README.md"
authors = [{name = "Marco Reidelbach", email = "reidelbach@zib.de"}]
maintainers = [{name = "Marco Reidelbach", email = "reidelbach@zib.de"}]
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"

dependencies = [
    "rdmo>=2.5.1"
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]


[project.urls]
homepage = "https://github.com/MaRDI4NFDI/MaRDMO-Plugin"

[tool.setuptools.dynamic]
version = {attr = "MaRDMO.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["MaRDMO*"]

[tool.setuptools.package-data]
"MaRDMO" = ["templates/MaRDMO/*.html", "templates/MaRDMO/partials/*.html", "templates/projects/*.html", "data/*.json", "static/MaRDMO/css/*.css", "static/MaRDMO/images/*.png", "static/MaRDMO/js/**/*", "algorithm/data/*.json", "model/data/*.json", "components/publication/data/*.json", "search/data/*.json", "workflow/data/*.json", "model/queries/*.sparql", "model/queries/split/*.sparql", "algorithm/queries/*.sparql", "components/publication/queries/*.sparql", "workflow/queries/*.sparql", "components/fill/queries/*.sparql", "locale/*/LC_MESSAGES/django.po", "locale/*/LC_MESSAGES/django.mo"]

[project.optional-dependencies]
# pip install -e ".[test]"; the tests and CI use these
test = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-socket>=0.7",
    "rdflib>=7",
    "pyyaml>=6",
    "coverage[toml]>=7",
    "ruff>=0.6",
    # The layers of MaRDMO (lint-imports, see [tool.importlinter]); 2.15 is
    # the last for Python 3.10 and knows every part of the contracts
    "import-linter>=2.15,<3",
    # tests/static/test_package_data.py reads pyproject.toml (tomllib from 3.11)
    "tomli>=2; python_version < '3.11'",
    "build>=1",
    # tools/messages.py: the German catalog (tests/static/test_translations.py)
    "babel>=2.14",
    "polib>=1.2",
]
# pip install -e ".[browser]" && playwright install chromium; tests/browser (BROWSER=1)
browser = [
    "playwright>=1.48",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
# No network in the tests: portal, Wikidata and citation services are
# replaced by recorded answers (pytest-socket fails every other request)
# Tests that need the database create its tables without RDMO's migrations (faster)
addopts = "--disable-socket --allow-unix-socket --no-migrations"
filterwarnings = [
    # RDMO's URL fields ahead of Django 6; not MaRDMO's to fix
    "ignore:The default scheme will be changed",
    # django-compressor, used by RDMO's templates
    "ignore:codecs.open\\(\\) is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["MaRDMO"]

[tool.coverage.report]
# The floor CI holds the coverage to (91 % on 2026-11-17, a little room for
# the jobs that skip some tests); raise it with the coverage, never lower it
fail_under = 89

[tool.ruff]
extend-exclude = ["dev-tests"]

[tool.ruff.lint]
# Errors (pyflakes, syntax) and the blank lines between definitions (PEP 8).
# The blank-line rules are still preview rules of ruff: preview is on for
# them only (explicit-preview-rules)
select = ["F", "E9", "E301", "E302", "E303", "E304", "E305", "E306"]
preview = true
explicit-preview-rules = true

# The layers of MaRDMO (docs: Concepts, Architecture), checked by lint-imports
[tool.importlinter]
root_package = "MaRDMO"
# The forbidden contract names packages outside MaRDMO
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Each layer uses only the layers below it; the catalogs are independent of each other"
type = "layers"
containers = ["MaRDMO"]
# ":" siblings may use each other, "|" siblings may not; every module of
# MaRDMO must be in a layer (exhaustive)
layers = [
    "urls : views : main : apps : router : builders : providers : optionsets : templatetags",
    "model | algorithm | workflow | search",
    "export",
    "components",
    "project | sources",
    "core",
]
exhaustive = true
exhaustive_ignores = ["locale", "static", "templates", "data"]
ignore_imports = [
    # The one exception: sources/ commits MaRDMO's pending writes before a
    # request, so no transaction stays open while waiting for the answer
    "MaRDMO.sources.* -> MaRDMO.project.writes",
]

[[tool.importlinter.contracts]]
# core uses no database and sends no requests: no RDMO, no requests here;
# django.db is checked by tests/static/test_architecture.py (an outside
# package's part cannot be forbidden here)
name = "core uses neither RDMO nor requests"
type = "forbidden"
source_modules = ["MaRDMO.core"]
forbidden_modules = ["rdmo", "requests"]
